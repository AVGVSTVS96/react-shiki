name: Test

on: [pull_request]

jobs:
  test:
    name: test (${{ matrix.react-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-version: 18.3.1
            types-version: 18
          - react-version: 19.2.6
            types-version: 19
          - react-version: catalog
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter react-shiki install --frozen-lockfile

      - name: Use React ${{ matrix.react-version }}
        if: matrix.react-version != 'catalog'
        run: pnpm --filter react-shiki add --save-dev react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }} @types/react@${{ matrix.types-version }} @types/react-dom@${{ matrix.types-version }}

      - name: Test
        run: pnpm --filter react-shiki exec vitest run
